name: Publier le royaume

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Forcer la récupération même si le relevé du jour est publié
        type: boolean
        default: false
  schedule:
    # Heure du Québec, changements d’heure inclus ; déclenchement approximatif.
    - cron: '17,47 5-13 * * *'
      timezone: America/Toronto

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier si le relevé du jour est déjà publié
        id: published
        run: node --experimental-strip-types server/check-published.ts
        env:
          FORCE_SYNC: ${{ inputs.force }}
          PAGES_STANDING_URL: https://kcote84.github.io/POOL-2026/data/standing.json
      - uses: actions/setup-node@v4
        if: steps.published.outputs.required == 'true'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: steps.published.outputs.required == 'true'
      - name: Vérifier les extracteurs et le cache
        if: steps.published.outputs.required == 'true'
        run: npm test
      - name: Installer Chromium pour les parcours utilisateurs
        if: steps.published.outputs.required == 'true' && (github.event_name == 'push' || inputs.force == true)
        run: npx playwright install --with-deps chromium
      - name: Vérifier les écrans, le dragon et l’accessibilité
        if: steps.published.outputs.required == 'true' && (github.event_name == 'push' || inputs.force == true)
        run: npm run test:ui
      - name: Restaurer le dernier résultat valide
        if: steps.published.outputs.required == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/marqueur.json
          key: marqueur-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: marqueur-v1-
      - name: Récupérer Marqueur côté serveur
        if: steps.published.outputs.required == 'true'
        id: sync
        run: npm run sync:pages
        env:
          PAGES_SEED_URL: https://kcote84.github.io/POOL-2026/data/snapshot.json
          SYNC_INTERVAL_MINUTES: '15'
          STALE_AFTER_MINUTES: '1620'
      - name: Conserver le résultat pour le prochain cycle
        if: steps.published.outputs.required == 'true' && hashFiles('.cache/marqueur.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/marqueur.json
          key: marqueur-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Compiler pour /POOL-2026/
        if: steps.published.outputs.required == 'true'
        run: npm run build:pages
      - uses: actions/configure-pages@v5
        if: steps.published.outputs.required == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.published.outputs.required == 'true'
        id: pages_artifact
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Attendre la disponibilité de l’artéfact Pages
        if: steps.published.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node --input-type=module <<'JS'
          const {GITHUB_API_URL, GITHUB_REPOSITORY, GITHUB_RUN_ID, GH_TOKEN, ARTIFACT_ID, ARTIFACT_NAME} = process.env;
          if (!/^\d+$/.test(ARTIFACT_ID ?? '') || !ARTIFACT_NAME || !GH_TOKEN) {
            throw new Error('Métadonnées d’envoi Pages manquantes.');
          }
          const url = new URL(`${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts`);
          url.searchParams.set('name', ARTIFACT_NAME);
          url.searchParams.set('per_page', '100');
          const deadline = Date.now() + 60_000;
          let verified = false;
          while (Date.now() < deadline) {
            let response;
            try {
              response = await fetch(url, {
                headers: {Accept: 'application/vnd.github+json', Authorization: `Bearer ${GH_TOKEN}`},
                signal: AbortSignal.timeout(Math.min(5000, Math.max(1, deadline - Date.now()))),
              });
            } catch (error) {
              console.log(`Lecture temporairement indisponible : ${error.name}`);
            }
            if (response?.ok) {
              const {artifacts, total_count} = await response.json();
              const matching = artifacts.filter(artifact => artifact.name === ARTIFACT_NAME);
              if (matching.length > 1 || total_count > 1) throw new Error('Plusieurs artéfacts portent le nom de cette tentative.');
              if (matching.length === 1) {
                const [artifact] = matching;
                if (String(artifact.id) !== ARTIFACT_ID || artifact.expired !== false) {
                  throw new Error('L’artéfact visible ne correspond pas à l’envoi valide de cette tentative.');
                }
                console.log(`Artéfact Pages vérifié : ${ARTIFACT_NAME} (ID ${ARTIFACT_ID})`);
                verified = true;
                break;
              }
            } else if (response && ![404, 429].includes(response.status) && response.status < 500) {
              throw new Error(`Vérification de l’artéfact refusée : HTTP ${response.status}`);
            }
            const remaining = deadline - Date.now();
            if (remaining <= 0) throw new Error('Artéfact Pages non visible dans le délai.');
            await new Promise(resolve => setTimeout(resolve, Math.min(3000, remaining)));
          }
          if (!verified) throw new Error('Artéfact Pages non visible dans le délai.');
          JS
      - name: Publier GitHub Pages
        if: steps.published.outputs.required == 'true'
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          node --input-type=module <<'JS'
          import { appendFile } from 'node:fs/promises';
          
          const env = process.env;
          const artifactId = Number(env.ARTIFACT_ID);
          if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw new Error('ID Pages invalide.');
          const oidc = new URL(env.ACTIONS_ID_TOKEN_REQUEST_URL);
          const oidcResponse = await fetch(oidc, {
            headers: { Authorization: `Bearer ${env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            redirect: 'error', signal: AbortSignal.timeout(10_000),
          });
          if (!oidcResponse.ok) throw new Error(`Jeton OIDC refusé : HTTP ${oidcResponse.status}.`);
          const { value: token } = await oidcResponse.json();
          if (!token) throw new Error('Jeton OIDC absent.');
          
          const api = `${env.GITHUB_API_URL}/repos/${env.GITHUB_REPOSITORY}/pages/deployments`;
          const headers = {
            Accept: 'application/vnd.github+json', Authorization: `Bearer ${env.GH_TOKEN}`,
            'Content-Type': 'application/json',
          };
          const request = (url, opts = {}) => fetch(url, {
            ...opts, headers, redirect: 'error', signal: AbortSignal.timeout(10_000),
          });
          const response = await request(api, {
            method: 'POST',
            body: JSON.stringify({ artifact_id: artifactId, pages_build_version: env.GITHUB_SHA, oidc_token: token }),
          });
          if (!response.ok) throw new Error(`Création Pages refusée : HTTP ${response.status} (artéfact ${artifactId}).`);
          const deployment = await response.json();
          const id = String(deployment.id ?? deployment.status_url?.split('/').pop() ?? '');
          if (!/^[a-zA-Z0-9_-]+$/.test(id)) throw new Error('Référence de déploiement invalide.');
          console.log(`Déploiement Pages ${id} créé avec l’artéfact ${artifactId}.`);
          
          const deadline = Date.now() + 300_000;
          let published = false;
          const final = new Set(['deployment_failed','deployment_perms_error','deployment_content_failed','deployment_cancelled','deployment_lost']);
          while (Date.now() < deadline) {
            let statusResponse;
            try { statusResponse = await request(`${api}/${id}`); }
            catch (error) { console.log(`Lecture Pages réessayée : ${error.name}`); }
            if (statusResponse?.ok) {
              const { status } = await statusResponse.json();
              if (status === 'succeed') {
                await appendFile(env.GITHUB_OUTPUT, 'page_url=https://kcote84.github.io/POOL-2026/\n');
                console.log(`Déploiement Pages ${id} réussi, artéfact ${artifactId}.`);
                published = true;
                break;
              }
              if (final.has(status)) throw new Error(`Déploiement Pages ${id} : ${status}.`);
            } else if (statusResponse && ![404, 429].includes(statusResponse.status) && statusResponse.status < 500) {
              throw new Error(`Lecture du déploiement Pages refusée : HTTP ${statusResponse.status}.`);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!published) throw new Error(`Déploiement Pages ${id} non confirmé dans le délai; ne pas relancer sans vérifier son état.`);
          JS

      - name: Signaler un échec de synchronisation après publication du secours
        if: steps.published.outputs.required == 'true' && steps.sync.outputs.sync_failed == 'true'
        run: |
          echo "::error::La récupération Marqueur a échoué. Le dernier relevé disponible a été conservé. Consulter les journaux de synchronisation."
          exit 1
